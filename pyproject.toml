[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdekit"
version = "0.1.0"
description = "Finite-difference PDE solvers written from scratch, with measured convergence orders."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Carlos Da Silva Macedo" }]
license = "MIT"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "sympy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79